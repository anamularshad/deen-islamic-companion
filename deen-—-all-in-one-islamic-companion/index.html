    <script>
      (function() {
        // Fix for Chrome extensions attempting to monkey-patch window.fetch
        // Prevents: "TypeError: Cannot set property fetch of #<Window> which has only a getter"
        try {
          if (typeof window !== 'undefined') {
            var rawFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
            var currentFetch = rawFetch;
            
            // Redefine fetch on window with both getter and setter
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return currentFetch; },
                set: function(val) { currentFetch = val; },
                configurable: true,
                enumerable: true
              });
            } catch (errWindow) {
              // Fallback to Window.prototype if direct define on window is restricted
              try {
                if (typeof Window !== 'undefined' && Window.prototype) {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() { return currentFetch; },
                    set: function(val) { currentFetch = val; },
                    configurable: true,
                    enumerable: true
                  });
                }
              } catch (errProto) {}
            }
          }
        } catch (e) {}

        // Global capture of extension errors and benign Vite HMR drops
        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            var filename = String(event.filename || (event.error && event.error.fileName) || '');
            var msg = String(event.message || (event.error && event.error.message) || '');
            if (
              filename.indexOf('chrome-extension://') !== -1 ||
              filename.indexOf('moz-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }, true);

          var prevOnError = window.onerror;
          window.onerror = function(msg, url, line, col, error) {
            var sMsg = String(msg || (error && error.message) || '');
            var sUrl = String(url || '');
            if (
              sUrl.indexOf('chrome-extension://') !== -1 ||
              sUrl.indexOf('moz-extension://') !== -1 ||
              sMsg.indexOf('Cannot set property fetch') !== -1 ||
              sMsg.indexOf('WebSocket closed without opened') !== -1
            ) {
              return true;
            }
            if (typeof prevOnError === 'function') {
              return prevOnError.apply(this, arguments);
            }
            return false;
          };

          window.addEventListener('unhandledrejection', function(event) {
            var reason = event.reason;
            var msg = String((reason && reason.message) || reason || '');
            var stack = String((reason && reason.stack) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              stack.indexOf('chrome-extension://') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          });
        }

        // Vite Safe WebSocket proxy for container environments
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('vite') || url.includes('token=')));
            if (isViteHmr) {
              const target = new EventTarget();
              const fakeWs = {
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                url: url,
                protocol: 'vite-hmr',
                extensions: '',
                bufferedAmount: 0,
                binaryType: 'blob',
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                },
                removeEventListener: function(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                },
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
              };
              setTimeout(() => {
                target.dispatchEvent(new Event('open'));
                if (typeof fakeWs.onopen === 'function') fakeWs.onopen(new Event('open'));
              }, 0);
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          }
          ViteSafeWebSocket.prototype = OrigWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          ViteSafeWebSocket.OPEN = OrigWebSocket.OPEN;
          ViteSafeWebSocket.CLOSING = OrigWebSocket.CLOSING;
          ViteSafeWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = ViteSafeWebSocket;
        }

        const origError = console.error;
        console.error = function(...args) {
          const combined = args.map(a => String((a && a.message) || (a && a.stack) || a || '')).join(' ');
          if (
            combined.includes('Cannot set property fetch') ||
            combined.includes('WebSocket closed without opened') ||
            combined.includes('chrome-extension://')
          ) {
            return;
          }
          return origError.apply(console, args);
        };
      })();
    </script>
